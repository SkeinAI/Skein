<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skeinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f74ff" />
      <stop offset="100%" stop-color="#0c2596" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#skeinBg)" />

  <!-- Skein mark: two intertwined loops of thread -->
  <g filter="url(#dropShadow)" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="72" ry="168" transform="rotate(-35 256 256)" />
    <ellipse cx="256" cy="256" rx="72" ry="168" transform="rotate(35 256 256)" />
  </g>
  <circle cx="256" cy="256" r="34" fill="#ffffff" filter="url(#dropShadow)" />
</svg>
